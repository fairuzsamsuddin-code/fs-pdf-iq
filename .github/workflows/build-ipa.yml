name: Build iOS app (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for device)
        run: |
          set +e
          xcodebuild \
            -project FSPDFIQ.xcodeproj \
            -scheme FSPDFIQ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          echo $? > build-status.txt
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -300 || true

      - name: Package .ipa
        run: |
          if [ "$(cat build-status.txt)" = "0" ] && [ -f build/Build/Products/Release-iphoneos/FSPDFIQ.app/FSPDFIQ ]; then
            mkdir -p Payload
            cp -R build/Build/Products/Release-iphoneos/FSPDFIQ.app Payload/
            zip -qry fs-PDF-IQ-unsigned.ipa Payload
            ls -lh fs-PDF-IQ-unsigned.ipa
          else
            echo "Build failed - no ipa"
          fi

      - name: Upload .ipa
        if: hashFiles('fs-PDF-IQ-unsigned.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fs-PDF-IQ-ipa
          path: fs-PDF-IQ-unsigned.ipa

      - name: Simulator smoke test + screenshots
        if: always()
        continue-on-error: true
        run: |
          mkdir -p out/shots
          set +e
          xcodebuild -project FSPDFIQ.xcodeproj -scheme FSPDFIQ -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild build > out/sim-build.log 2>&1
          grep -E "error:" out/sim-build.log | sort -u > out/sim-errors.txt; rm -f out/sim-build.log
          APP=simbuild/Build/Products/Debug-iphonesimulator/FSPDFIQ.app
          if [ ! -d "$APP" ]; then echo "no simulator build"; exit 0; fi
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16 Pro') or x['name'].startswith('iPhone 1')]; print(c[0]['udid'])")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          BID=my.fsiq.pdfiq
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          mkdir -p "$DATA/Documents/fixtures" && cp TestFixtures/* "$DATA/Documents/fixtures/"
          xcrun simctl launch --console-pty "$UDID" $BID -selftest > out/selftest.log 2>&1 &
          for i in $(seq 1 80); do grep -q "SELFTEST END" out/selftest.log && break; sleep 3; done
          xcrun simctl terminate "$UDID" $BID
          mkdir -p out/testout
          find "$DATA/tmp/FSPDFIQ/TestOut" -type f \( -name "*.pdf" -o -name "*.dxf" -o -name "*.csv" -o -name "*.docx" -o -name "*.pptx" -o -name "*.xlsx" \) -size -3M -exec cp {} out/testout/ \;
          shot() { xcrun simctl terminate "$UDID" $BID >/dev/null 2>&1; xcrun simctl launch "$UDID" $BID "$@"; sleep 7; xcrun simctl io "$UDID" screenshot "out/shots/$NAME.png"; }
          NAME=01-home shot
          NAME=02-home-en shot -lang en
          xcrun simctl ui "$UDID" appearance dark; NAME=03-home-dark shot -lang ms; xcrun simctl ui "$UDID" appearance light
          NAME=04-compress shot -lang ms -tool compress-pdf -sample
          NAME=05-workbench shot -lang ms -tool workbench -sample
          NAME=06-edit shot -lang ms -tool edit-pdf -sample
          NAME=07-sign shot -lang ms -tool sign-pdf -sample
          NAME=08-redact shot -lang en -tool redact-pdf -sample
          NAME=09-scan shot -lang ms -tool scan-to-pdf
          NAME=10-ai shot -lang ms -tool pdf-to-ai -sample
          NAME=11-listen shot -lang ms -tool listen-pdf -sample
          NAME=12-crop shot -lang ms -tool crop-pdf -sample
          NAME=13-preview shot -lang ms -tool preview-pdf -sample
          grep -h "SELFTEST" out/selftest.log > out/selftest.txt || true

      - name: Publish results to the "ci" branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          grep -E "error:" build.log | sort -u | head -300 > out/errors.txt 2>/dev/null || true
          cp build-status.txt out/ 2>/dev/null || true
          if [ -f fs-PDF-IQ-unsigned.ipa ]; then cp fs-PDF-IQ-unsigned.ipa out/; fi
          cd out
          git init -q
          git checkout -q -b ci
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci

      - name: Fail if the build failed
        run: test "$(cat build-status.txt)" = "0"
